<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Porto</title>
    <link rel="icon" type="image/png" href="favicon.png" />

    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }

      @font-face {
        font-family: "Mohave";
        src: url("fonts/Mohave-Medium.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      #version-text {
        margin-top: 6px;
        font-size: 11px;
        opacity: 0.5;
        font-family: "Mohave", Arial, sans-serif;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }

      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        background: #000;
      }

      #loader {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        z-index: 10;
      }

      #loader img {
        width: 160px;
      }

      #progress {
        width: 300px;
        height: 12px;
        background: #333;
        border-radius: 6px;
        overflow: hidden;
        margin-top: 20px;
      }

      #progress div {
        height: 100%;
        width: 0%;
        background: #f5c400;
        transition: width 0.2s;
      }

      #status {
        margin-top: 10px;
        font-family: "Mohave", Arial, sans-serif;
        font-size: 14px;
        opacity: 0.8;
      }
      #app-version {
        position: fixed;
        bottom: 12px;
        left: 14px;
        color: #f5c400;
        font-size: 11px;
        opacity: 0.7;
        z-index: 9999;
        pointer-events: none;
        font-family: "Mohave", Arial, sans-serif;
      }
    </style>
  </head>

  <body>
    <div id="unity-container">
      <div id="loader">
        <img src="images/splash.png" alt="Logo" />
        <div id="progress"><div></div></div>
        <div id="status"></div>
        <!-- <div id="version-text"></div> -->
      </div>

      <canvas id="unity-canvas"></canvas>
    </div>
    <div id="app-version"></div>

    <!-- ===================================================== -->
    <!-- 🚀 CONFIG SYSTEM -->
    <!-- ===================================================== -->
    <script>
      /**
       * APP VERSION (MANUAL)
       */
      const APP_VERSION = "1.2.4";

      /**
       * ENV DETECTION
       * - LOCAL (localhost) → DEV
       * - /devtest → DEV
       * - selain itu → PROD
       */
      const IS_LOCAL =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1";

      const IS_DEV = IS_LOCAL || window.location.pathname.includes("devtest");

      /**
       * BUILD FILE PATH
       * (DEV dan PROD masing-masing ambil dari foldernya sendiri)
       */
      const BUILD_FILE = "buildversion.txt";

      /**
       * GLOBAL BUILD VERSION (SAFE INIT)
       */
      let BUILD_VERSION = "init-" + Date.now();

      console.log("🌍 ENV:", IS_DEV ? "DEV" : "PROD");
    </script>

    <!-- ===================================================== -->
    <!-- 📦 FETCH BUILD VERSION -->
    <!-- ===================================================== -->
    <script>
      async function fetchBuildVersion() {
        try {
          const res = await fetch(BUILD_FILE + "?t=" + Date.now(), {
            cache: "no-store",
          });

          if (!res.ok) throw new Error("Build version not found");

          const text = await res.text();
          BUILD_VERSION = text.trim();

          console.log("🚀 Build Version:", BUILD_VERSION);
        } catch (err) {
          console.warn("⚠️ Failed fetch build version:", err);
        }

        startUnity();
        startAutoReload();
        showVersion();
      }
    </script>

    <!-- ===================================================== -->
    <!-- 🎮 START UNITY -->
    <!-- ===================================================== -->
    <script>
      function startUnity() {
        const canvas = document.querySelector("#unity-canvas");
        const loader = document.querySelector("#loader");
        const progressBar = document.querySelector("#progress div");

        const buildUrl = "Build";

        const config = {
          dataUrl: buildUrl + "/portofolio.data?v=" + BUILD_VERSION,
          frameworkUrl:
            buildUrl + "/portofolio.framework.js?v=" + BUILD_VERSION,
          codeUrl: buildUrl + "/portofolio.wasm?v=" + BUILD_VERSION,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "{{COMPANY_NAME}}",
          productName: "{{PRODUCT_NAME}}",
          productVersion: BUILD_VERSION,
        };

        const script = document.createElement("script");
        script.src = buildUrl + "/portofolio.loader.js?v=" + BUILD_VERSION;

        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBar.style.width = progress * 100 + "%";
          })
            .then(() => {
              loader.style.display = "none";
            })
            .catch((err) => {
              console.error(err);
              alert(err);
            });
        };

        document.body.appendChild(script);
      }
    </script>

    <!-- ===================================================== -->
    <!-- 🔄 AUTO RELOAD SYSTEM -->
    <!-- ===================================================== -->
    <script>
      function startAutoReload() {
        let lastVersion = BUILD_VERSION;

        setInterval(async () => {
          try {
            const res = await fetch(BUILD_FILE + "?t=" + Date.now(), {
              cache: "no-store",
            });

            const latest = (await res.text()).trim();

            if (latest !== lastVersion) {
              console.log("🔥 NEW BUILD DETECTED:", latest);

              // clear browser cache (important for Unity WebGL)
              if ("caches" in window) {
                const keys = await caches.keys();
                await Promise.all(keys.map((k) => caches.delete(k)));
              }

              location.reload();
            }
          } catch (e) {
            console.warn("Auto reload check failed");
          }
        }, 5000); // cek tiap 5 detik
      }
    </script>

    <!-- ===================================================== -->
    <!-- 🧹 SERVICE WORKER CLEANUP (DEV ONLY SAFE) -->
    <!-- ===================================================== -->
    <script>
      if ("serviceWorker" in navigator && IS_DEV) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((reg) => reg.unregister());
        });
      }
    </script>

    <!-- ===================================================== -->
    <!-- 🏷 VERSION DISPLAY -->
    <!-- ===================================================== -->
    <script>
      function showVersion() {
        const el = document.getElementById("app-version");
        if (!el) return;

        if (IS_DEV) {
          el.innerText = `${BUILD_VERSION} | v${APP_VERSION}`;
        } else {
          el.innerText = `v${APP_VERSION}`;
        }
      }
    </script>

    <!-- ===================================================== -->
    <!-- 🚀 INIT -->
    <!-- ===================================================== -->
    <script>
      fetchBuildVersion();
    </script>

    <!-- ===================================================== -->
    <!--⌛LOADING TIPS-->
    <!-- ===================================================== -->
    <script>
      const tips = [
        "Loading assets, please wait...",
        "Ensure you have a stable internet connection for faster loading.",
        "If loading takes too long, try refreshing the page.",
        "Use a modern browser like Chrome for the best performance.",
        "Memuat assets, mohon tunggu...",
        "Pastikan koneksi internet stabil untuk loading lebih cepat.",
        "Jika loading terlalu lama, coba refresh halaman.",
        "Gunakan browser terbaru seperti Chrome untuk performa terbaik.",
      ];

      let tipIndex = 0;
      const statusEl = document.getElementById("status");

      function rotateTips() {
        if (!statusEl) return;

        statusEl.innerText = tips[tipIndex];
        tipIndex = (tipIndex + 1) % tips.length;
      }

      // mulai rotasi tiap 5 detik
      setInterval(rotateTips, 5000);

      // tampilkan pertama kali
      rotateTips();
    </script>
  </body>
</html>
