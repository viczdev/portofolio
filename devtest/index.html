<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Porto</title>
    <link rel="icon" type="image/png" href="favicon.png" />

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }

      @font-face {
        font-family: "Mohave";
        src: url("fonts/Mohave-Medium.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      #version-text {
        margin-top: 6px;
        font-size: 11px;
        opacity: 0.5;
        font-family: "Mohave", Arial, sans-serif;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }

      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        background: #000;
      }

      #loader {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1b1b1b;
        color: #fff;
        z-index: 10;
      }

      #loader img {
        width: 160px;
      }

      #progress {
        width: 300px;
        height: 12px;
        background: #333;
        border-radius: 6px;
        overflow: hidden;
        margin-top: 20px;
      }

      #progress div {
        height: 100%;
        width: 0%;
        background: #f5c400;
        transition: width 0.2s;
      }

      #status {
        margin-top: 10px;
        font-family: "Mohave", Arial, sans-serif;
        font-size: 14px;
        opacity: 0.8;
      }
      #app-version {
        position: fixed;
        bottom: 10px;
        right: 10px;
        color: white;
        font-size: 12px;
        opacity: 0.7;
        z-index: 9999;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="unity-container">
      <div id="loader">
        <img src="images/splash.png" alt="Logo" />
        <div id="progress"><div></div></div>
        <div id="status"></div>
        <div id="version-text"></div>
      </div>

      <canvas id="unity-canvas"></canvas>
    </div>
    <div id="app-version"></div>
    <script>
      /**
       * ============================================
       * 🚀 COMMAND SUMMARY (READ THIS FIRST)
       * ============================================
       *
       * [RELEASE FLOW]
       * 1. Ubah DISPLAY_VERSION (manual)
       * 2. Build Unity WebGL
       * 3. Upload ke GitHub Pages
       *
       * [CACHE SYSTEM]
       * - INTERNAL_VERSION = DISPLAY_VERSION + timestamp
       * - Digunakan untuk bypass browser cache
       *
       * [FILES AFFECTED]
       * - loader.js
       * - .data
       * - .framework.js
       * - .wasm
       *
       * [UI]
       * - DISPLAY_VERSION → ditampilkan ke user
       * - INTERNAL_VERSION → hanya untuk system
       *
       * ============================================
       */

      // ============================================
      // 🔢 VERSION CONTROL
      // ============================================

      const DISPLAY_VERSION = "1.2.2"; // 🔧 UPDATE SETIAP BUILD
      const INTERNAL_VERSION = DISPLAY_VERSION + "-" + Date.now(); // 🔥 AUTO CACHE BUSTER

      console.log("🚀 WebGL Version:", INTERNAL_VERSION);

      // ============================================
      // 🖥️ UI: SHOW VERSION
      // ============================================

      window.addEventListener("load", () => {
        const el = document.getElementById("app-version");
        if (el) el.innerText = "v" + DISPLAY_VERSION;
      });

      // ============================================
      // 📦 LOAD UNITY LOADER (DYNAMIC)
      // ============================================

      const loaderScript = document.createElement("script");
      loaderScript.src = "Build/devtest.loader.js?v=" + INTERNAL_VERSION;

      loaderScript.onload = () => {
        console.log("✅ Loader loaded");
        startUnity();
      };

      document.body.appendChild(loaderScript);

      // ============================================
      // 🎮 START UNITY INSTANCE
      // ============================================

      function startUnity() {
        const canvas = document.querySelector("#unity-canvas");
        const loader = document.querySelector("#loader");
        const progressBar = document.querySelector("#progress div");

        const config = {
          dataUrl: "Build/devtest.data?v=" + INTERNAL_VERSION,

          frameworkUrl:
            "Build/devtest.framework.js?v=" + INTERNAL_VERSION,

          codeUrl: "Build/devtest.wasm?v=" + INTERNAL_VERSION,

          streamingAssetsUrl: "StreamingAssets",

          companyName: "{{COMPANY_NAME}}",
          productName: "{{PRODUCT_NAME}}",
          productVersion: DISPLAY_VERSION,
        };

        console.log("📦 Loading Unity with config:", config);

        createUnityInstance(canvas, config, (progress) => {
          progressBar.style.width = progress * 100 + "%";
        })
          .then(() => {
            console.log("🎉 Unity Loaded");
            loader.style.display = "none";
            resizeCanvas();
          })
          .catch((err) => {
            console.error("❌ Unity Load Error:", err);
            alert(err);
          });
      }

      // ============================================
      // 📐 RESPONSIVE CANVAS
      // ============================================

      function resizeCanvas() {
        const canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      window.addEventListener("resize", resizeCanvas);

      // ============================================
      // 🧪 DEBUG COMMANDS (OPTIONAL)
      // ============================================

      /**
       * 👉 Pakai di console browser:
       *
       * clearCache()
       * → force reload tanpa cache
       *
       * showVersion()
       * → tampilkan versi sekarang
       */

      window.clearCache = () => {
        console.log("🧹 Clearing cache (hard reload)...");
        location.reload(true);
      };

      window.showVersion = () => {
        console.log("📌 Display Version:", DISPLAY_VERSION);
        console.log("📌 Internal Version:", INTERNAL_VERSION);
      };
    </script>
  </body>
</html>
