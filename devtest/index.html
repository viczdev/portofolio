<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Porto</title>
    <link rel="icon" type="image/png" href="favicon.png" />

    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }

      @font-face {
        font-family: "Mohave";
        src: url("fonts/Mohave-Medium.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      #version-text {
        margin-top: 6px;
        font-size: 11px;
        opacity: 0.5;
        font-family: "Mohave", Arial, sans-serif;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }

      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        background: #000;
      }

      #loader {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1b1b1b;
        color: #fff;
        z-index: 10;
      }

      #loader img {
        width: 160px;
      }

      #progress {
        width: 300px;
        height: 12px;
        background: #333;
        border-radius: 6px;
        overflow: hidden;
        margin-top: 20px;
      }

      #progress div {
        height: 100%;
        width: 0%;
        background: #f5c400;
        transition: width 0.2s;
      }

      #status {
        margin-top: 10px;
        font-family: "Mohave", Arial, sans-serif;
        font-size: 14px;
        opacity: 0.8;
      }
      #app-version {
        position: fixed;
        bottom: 10px;
        right: 10px;
        color: #f5c400;
        font-size: 12px;
        opacity: 0.7;
        z-index: 9999;
        pointer-events: none;
        font-family: "Mohave", Arial, sans-serif;
      }
    </style>
  </head>

  <body>
    <div id="unity-container">
      <div id="loader">
        <img src="images/splash.png" alt="Logo" />
        <div id="progress"><div></div></div>
        <div id="status"></div>
        <!-- <div id="version-text"></div> -->
      </div>

      <canvas id="unity-canvas"></canvas>
    </div>
    <div id="app-version"></div>

    <!-- ===================================================== -->
    <!-- 🚀 CONFIG SYSTEM -->
    <!-- ===================================================== -->
    <script>
      // Version
      const VERSION = "1.0.0"; // Update this manually for each release
      /**
       * ENV DETECTION
       * - devtest → DEV
       * - root → PROD
       */
      const ENV = window.location.pathname.includes("devtest")
        ? "DEV-Build-" + BUILD_VERSION + " | "
        : "";

      /**
       * BUILD FILE LOCATION
       * - DEV  → /devtest/buildversion.txt
       * - PROD → /buildversion.txt
       */
      const BUILD_FILE =
        ENV === "DEV" ? "buildversion.txt" : "buildversion.txt";

      /**
       * FALLBACK VERSION
       * - used if fetch gagal
       */
      let BUILD_VERSION = "fallback-" + Date.now();

      console.log("🌍 ENV:", ENV);
    </script>

    <!-- ===================================================== -->
    <!-- 📦 FETCH BUILD VERSION -->
    <!-- ===================================================== -->
    <script>
      async function fetchBuildVersion() {
        try {
          const res = await fetch(BUILD_FILE + "?t=" + Date.now(), {
            cache: "no-store",
          });

          if (!res.ok) throw new Error("Build version not found");

          const text = await res.text();
          BUILD_VERSION = text.trim();

          console.log("🚀 Build Version:", BUILD_VERSION);
        } catch (err) {
          console.warn("⚠️ Failed fetch build version:", err);
        }

        startUnity();
        startAutoReload();
        showVersion();
      }
    </script>

    <!-- ===================================================== -->
    <!-- 🎮 START UNITY -->
    <!-- ===================================================== -->
    <script>
      function startUnity() {
        const canvas = document.querySelector("#unity-canvas");
        const loader = document.querySelector("#loader");
        const progressBar = document.querySelector("#progress div");

        const buildUrl = "Build";

        const config = {
          dataUrl: buildUrl + "/devtest.data?v=" + BUILD_VERSION,
          frameworkUrl:
            buildUrl + "/devtest.framework.js?v=" + BUILD_VERSION,
          codeUrl: buildUrl + "/devtest.wasm?v=" + BUILD_VERSION,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "{{COMPANY_NAME}}",
          productName: "{{PRODUCT_NAME}}",
          productVersion: BUILD_VERSION,
        };

        const script = document.createElement("script");
        script.src = buildUrl + "/devtest.loader.js?v=" + BUILD_VERSION;

        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBar.style.width = progress * 100 + "%";
          })
            .then(() => {
              loader.style.display = "none";
            })
            .catch((err) => {
              console.error(err);
              alert(err);
            });
        };

        document.body.appendChild(script);
      }
    </script>

    <!-- ===================================================== -->
    <!-- 🔄 AUTO RELOAD SYSTEM -->
    <!-- ===================================================== -->
    <script>
      function startAutoReload() {
        let lastVersion = BUILD_VERSION;

        setInterval(async () => {
          try {
            const res = await fetch(BUILD_FILE + "?t=" + Date.now(), {
              cache: "no-store",
            });

            const latest = (await res.text()).trim();

            if (latest !== lastVersion) {
              console.log("🔥 NEW BUILD DETECTED:", latest);

              // clear cache (important)
              if ("caches" in window) {
                caches.keys().then((keys) => {
                  keys.forEach((key) => caches.delete(key));
                });
              }

              location.reload(true);
            }
          } catch (e) {
            console.warn("Auto reload check failed");
          }
        }, 5000); // lebih cepat (5 detik)
      }
    </script>

    <!-- ===================================================== -->
    <!-- 🧹 SERVICE WORKER UNREGISTER -->
    <!-- ===================================================== -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then(function (registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
      }
    </script>

    <!-- ===================================================== -->
    <!-- 🏷 VERSION DISPLAY -->
    <!-- ===================================================== -->
    <script>
      function showVersion() {
        const el = document.getElementById("app-version");
        if (el) {
          el.innerText = ENV + "v" + VERSION;
        }
      }
    </script>

    <!-- ===================================================== -->
    <!-- 🚀 INIT -->
    <!-- ===================================================== -->
    <script>
      fetchBuildVersion();
    </script>
  </body>
</html>
