<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Porto</title>
    <link rel="icon" type="image/png" href="favicon.png" />

    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }

      @font-face {
        font-family: "Mohave";
        src: url("fonts/Mohave-Medium.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      #version-text {
        margin-top: 6px;
        font-size: 11px;
        opacity: 0.5;
        font-family: "Mohave", Arial, sans-serif;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }

      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        background: #000;
      }

      #loader {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1b1b1b;
        color: #fff;
        z-index: 10;
      }

      #loader img {
        width: 160px;
      }

      #progress {
        width: 300px;
        height: 12px;
        background: #333;
        border-radius: 6px;
        overflow: hidden;
        margin-top: 20px;
      }

      #progress div {
        height: 100%;
        width: 0%;
        background: #f5c400;
        transition: width 0.2s;
      }

      #status {
        margin-top: 10px;
        font-family: "Mohave", Arial, sans-serif;
        font-size: 14px;
        opacity: 0.8;
      }
      #app-version {
        position: fixed;
        bottom: 10px;
        right: 10px;
        color: white;
        font-size: 12px;
        opacity: 0.7;
        z-index: 9999;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="unity-container">
      <div id="loader">
        <img src="images/splash.png" alt="Logo" />
        <div id="progress"><div></div></div>
        <div id="status"></div>
        <div id="version-text"></div>
      </div>

      <canvas id="unity-canvas"></canvas>
    </div>
    <div id="app-version"></div>
    <script>
      /**
       * ============================================
       * 🚀 COMMAND SUMMARY (READ THIS FIRST)
       * ============================================
       *
       * [RELEASE FLOW]
       * 1. Ubah DISPLAY_VERSION (manual)
       * 2. Build Unity WebGL
       * 3. Upload ke GitHub Pages
       *
       * [CACHE SYSTEM]
       * - INTERNAL_VERSION = DISPLAY_VERSION + timestamp
       * - Digunakan untuk bypass browser cache
       *
       * [FILES AFFECTED]
       * - loader.js
       * - .data
       * - .framework.js
       * - .wasm
       *
       * [UI]
       * - DISPLAY_VERSION → ditampilkan ke user
       * - INTERNAL_VERSION → hanya untuk system
       *
       * ============================================
       */

      /**

   * ============================================
   * 🚀 BUILD VERSION SYSTEM
   * ============================================
   *
   * - buildversion.txt = source of truth dari server
   * - digunakan untuk:
   *   ✔ cache busting
   *   ✔ auto update detection
   *
   * ============================================
   */

      const DISPLAY_VERSION = "1.2.2"; // untuk UI saja
      const VERSION_CHECK_INTERVAL = 15000;

      let BUILD_VERSION = null;

      // ============================================
      // 📥 LOAD BUILD VERSION FROM SERVER
      // ============================================

      function fetchBuildVersion() {
        return fetch("BuildVersion.txt?t=" + Date.now())
          .then((res) => res.text())
          .then((v) => v.trim());
      }

      // ============================================
      // 🚀 INIT APP
      // ============================================

      fetchBuildVersion().then((serverVersion) => {
        BUILD_VERSION = serverVersion;

        console.log("🚀 Build Version:", BUILD_VERSION);

        startApp();
      });

      // ============================================
      // 🖥️ UI VERSION
      // ============================================

      window.addEventListener("load", () => {
        const el = document.getElementById("app-version");
        if (el) el.innerText = "v" + DISPLAY_VERSION;
      });

      // ============================================
      // 📦 LOAD UNITY
      // ============================================

      function startApp() {
        const loaderScript = document.createElement("script");
        loaderScript.src = "Build/devtest.loader.js?v=" + BUILD_VERSION;

        loaderScript.onload = () => {
          console.log("✅ Loader loaded");
          startUnity();
        };

        document.body.appendChild(loaderScript);
      }

      // ============================================
      // 🎮 START UNITY
      // ============================================

      function startUnity() {
        const canvas = document.querySelector("#unity-canvas");
        const loader = document.querySelector("#loader");
        const progressBar = document.querySelector("#progress div");

        const config = {
          dataUrl: "Build/devtest.data?v=" + BUILD_VERSION,

          frameworkUrl: "Build/devtest.framework.js?v=" + BUILD_VERSION,

          codeUrl: "Build/devtest.wasm?v=" + BUILD_VERSION,

          streamingAssetsUrl: "StreamingAssets",

          companyName: "{{COMPANY_NAME}}",
          productName: "{{PRODUCT_NAME}}",
          productVersion: DISPLAY_VERSION,
        };

        createUnityInstance(canvas, config, (progress) => {
          progressBar.style.width = progress * 100 + "%";
        })
          .then(() => {
            loader.style.display = "none";
            resizeCanvas();

            // 🔄 start auto update
            startVersionChecker();
          })
          .catch((err) => {
            console.error(err);
            alert(err);
          });
      }

      // ============================================
      // 🔄 AUTO UPDATE CHECKER
      // ============================================

      function startVersionChecker() {
        console.log("🔄 Version checker started");

        setInterval(() => {
          fetchBuildVersion().then((latestVersion) => {
            if (latestVersion !== BUILD_VERSION) {
              console.log("🚨 New build detected:", latestVersion);

              // 🔥 AUTO RELOAD
              location.reload();
            }
          });
        }, VERSION_CHECK_INTERVAL);
      }

      // ============================================
      // 📐 RESPONSIVE
      // ============================================

      function resizeCanvas() {
        const canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      window.addEventListener("resize", resizeCanvas);
    </script>
  </body>
</html>
