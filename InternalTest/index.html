<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My WebGL Game</title>

    <!-- Favicon: letakkan favicon.png di folder template -->
    <link rel="icon" type="image/png" href="favicon.png?v=1.0" />

    <!-- Optional: theme / css -->
    <link rel="stylesheet" href="template.css" />

    <style>
      /* contoh style minimal untuk loading screen */
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #1b1b1b;
        color: #fff;
      }
      #unity-container {
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #loader {
        text-align: center;
      }
      #loader img {
        width: 160px;
        height: auto;
      }
      #progress {
        width: 300px;
        height: 12px;
        background: #333;
        border-radius: 6px;
        overflow: hidden;
        margin-top: 25px;
      }
      #progress > div {
        height: 100%;
        width: 0%;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <div id="loader">
        <img src="images/splash.png" alt="logo" />
        <div id="progress"><div></div></div>
      </div>

      <!-- Unity canvas akan diinsert oleh Unity loader -->
      <canvas id="unity-canvas" style="display: none"></canvas>
    </div>

    <!-- Unity loader script akan di-inject otomatis di sini saat build -->

    <!-- Versioning + cache-busting helper: ubah version setiap build -->
    <script>
      // Ubah string version ini setiap release (atau generate otomatis dari CI)
      var GAME_VERSION = "1.0.0";

      // Fungsi kecil untuk menambahkan ?v= ke asset Unity yang dipakai createUnityInstance
      // Unity biasanya men-generate loader code; jika kamu perlu meng-overwrite URL, lakukan di sini.
      function addVersion(url) {
        return (
          url +
          (url.indexOf("?") === -1
            ? "?v=" + GAME_VERSION
            : "&v=" + GAME_VERSION)
        );
      }

      // Jika kamu ingin memaksa clear cache ServiceWorker/Cache API ketika version berubah:
      (function () {
        try {
          var stored = localStorage.getItem("game_version");
          if (stored !== GAME_VERSION) {
            localStorage.setItem("game_version", GAME_VERSION);
            // Hapus cache storage (jika ada)
            if (window.caches) {
              caches
                .keys()
                .then((keys) => keys.forEach((k) => caches.delete(k)));
            }
          }
        } catch (e) {
          console.warn("Version check failed", e);
        }
      })();
    </script>
  </body>
</html>
